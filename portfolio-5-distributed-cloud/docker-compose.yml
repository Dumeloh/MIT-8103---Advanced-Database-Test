
services:
  primary:
    image: postgres:16
    container_name: carbon-pg-primary
    environment:
      POSTGRES_USER: carbon
      POSTGRES_PASSWORD: carbon_pass
      POSTGRES_DB: carbon_db
      REPLICATION_USER: replicator
      REPLICATION_PASSWORD: repl_pass
    ports:
      - "5433:5432"
    volumes:
      - primary_data:/var/lib/postgresql/data
      - ./primary-init:/docker-entrypoint-initdb.d:ro
    command:
      - postgres
      - -c
      - wal_level=replica
      - -c
      - max_wal_senders=10
      - -c
      - max_replication_slots=10
      - -c
      - hot_standby=on
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U carbon -d carbon_db"]
      interval: 5s
      timeout: 5s
      retries: 12

  replica:
    image: postgres:16
    container_name: carbon-pg-replica
    depends_on:
      primary:
        condition: service_healthy
    environment:
      PGUSER: replicator
      PGPASSWORD: repl_pass
      PGHOST: primary
      PGPORT: "5432"
      PGDATA: /var/lib/postgresql/data
    ports:
      - "5434:5432"
    volumes:
      - replica_data:/var/lib/postgresql/data
      - ./replica-entrypoint.sh:/usr/local/bin/replica-entrypoint.sh:ro
    entrypoint: ["/bin/bash", "/usr/local/bin/replica-entrypoint.sh"]

volumes:
  primary_data:
  replica_data:
